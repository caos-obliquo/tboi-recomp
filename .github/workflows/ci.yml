name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Desktop builds are the reference configuration. Anything that breaks here
  # breaks every other target, so this job runs first and gates the rest.
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: linux-clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          # Native ARM64, so ctest executes real aarch64 binaries instead of
          # inspecting cross-compiled objects. Cross-compilation is already
          # covered by the android-arm64 job below.
          - name: linux-arm64
            os: ubuntu-24.04-arm
            cc: gcc
            cxx: g++
          # Pinned rather than macos-latest. The default Apple runner is Apple
          # Silicon, so leaving it unpinned meant this job silently stopped
          # covering Intel macOS without anyone editing this file. Both
          # architectures are now named, so a runner default changing cannot
          # quietly narrow coverage.
          - name: macos-arm64
            os: macos-14
            cc: clang
            cxx: clang++
          - name: macos-x86_64
            os: macos-13
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The primary shipping target. Configuring against the NDK is the only thing
  # that proves the Android build has not silently acquired a host dependency.
  android:
    name: android-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      # Measured on this runner: ANDROID_NDK_LATEST_HOME resolved to NDK 30,
      # ANDROID_NDK_ROOT to 27.3, setup-ndk installed r26d (26.1.10909125), and
      # `command -v clang` returned the host /usr/bin/clang. No single
      # variable names the NDK we compile with, so we glob for a real driver
      # and log every candidate to make a future failure diagnosable.
      #
      # A step id must be unique within a job. The install step above owns
      # "ndk", so reusing it here silently discards our own outputs.
      - name: Resolve NDK root
        id: locate_ndk
        run: |
          wanted="aarch64-linux-android24-clang"
          want_series="26."
          best=""
          fallback=""
          for root in \
            "$ANDROID_NDK_HOME" \
            "$ANDROID_NDK_ROOT" \
            "$ANDROID_SDK_ROOT"/ndk/* \
            "$ANDROID_SDK_NDK_ROOT"/ndk/* \
            /usr/local/lib/android/sdk/ndk/* \
            "$HOME"/android-sdk/ndk/* \
            /opt/hostedtoolcache/Android-NDK/* \
            "$RUNNER_TOOL_CACHE"/Android-NDK/* ; do
            [ -n "$root" ] || continue
            [ -d "$root" ] || continue
            for prebuilt in "$root"/toolchains/llvm/prebuilt/*/bin ; do
              [ -x "$prebuilt/$wanted" ] || continue
              case "$root" in
                *"$want_series"*) [ -n "$best" ] || best="$root" ;;
                *)               [ -n "$fallback" ] || fallback="$root" ;;
              esac
            done
          done

          found="${best:-$fallback}"

          echo "::group::NDK probe"
          echo "PATH clang : $(command -v clang || echo none)"
          for v in ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_SDK_ROOT ANDROID_SDK_NDK_ROOT RUNNER_TOOL_CACHE ; do
            echo "$v=${!v:-<unset>}"
          done
          echo "found NDK : ${found:-<none>}"
          echo "::endgroup::"

          if [ -z "$found" ]; then
            echo "::error::no NDK root contained $wanted; see the probe above"
            exit 1
          fi
          echo "ndk_root=$found" >> "$GITHUB_OUTPUT"

      - name: Configure
        env:
          NDK: ${{ steps.locate_ndk.outputs.ndk_root }}
        run: |
          if [ -z "$NDK" ]; then
            echo "::error::NDK resolved empty; refusing to configure against the host toolchain"
            exit 1
          fi
          cmake -S . -B build-android \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-android-arm64.cmake \
            -DANDROID_NDK="$NDK"

      - name: Build
        run: cmake --build build-android -j

      # Reads EI_CLASS (offset 4) and e_machine (offset 0x12 LE) as bytes rather
      # than trusting objdump's format string: on this runner objdump printed
      # "elf64-little" and "architecture: UNKNOWN!" for a genuinely ARM64
      # object, because the host binutils has no aarch64 decoder.
      - name: Verify objects are ARM64
        run: |
          obj="$(find build-android -name 'engine.cpp.o' -print -quit)"
          if [ -z "$obj" ]; then
            echo "::error::no engine.cpp.o under build-android; nothing to inspect"
            exit 1
          fi
          echo "object: $obj"
          objdump -f "$obj" || true

          ei_class="$(od -An -tu1 -j4 -N1 "$obj" | tr -d '[:space:]')"
          e_machine="$(od -An -tx1 -j18 -N2 "$obj" | tr -d '[:space:]')"
          echo "EI_CLASS=$ei_class (2 = 64-bit)  e_machine=0x$e_machine (b700 = AArch64)"

          if [ "$ei_class" != "2" ]; then
            echo "::error::not a 64-bit ELF object"
            exit 1
          fi
          if [ "$e_machine" != "b700" ]; then
            echo "::error::e_machine is 0x$e_machine, expected 0xb700 (EM_AARCH64)"
            exit 1
          fi
          echo "ok  AArch64 object confirmed"

  # Warnings are already enabled in the project; this job turns them into a hard
  # failure so a new one cannot land unnoticed. -Werror is deliberately not set
  # in CMakeLists: this only gates Linux CI, not contributor builds.
  warnings:
    name: warnings-as-errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS=-Werror

      - name: Build
        run: cmake --build build -j

  # Memory errors in the binding layer and the data source are the failure modes
  # most likely to survive a green unit suite.
  sanitizers:
    name: asan-ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Guards the generated artifacts against drift: the spec header and the JSON
  # are produced from the binary by hand, and a stale copy is a silent lie.
  spec-freshness:
    name: generated-spec-is-current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Regenerate and diff
        run: |
          python3 tools/gen-api-spec.py
          git diff --exit-code bindings/isaac-api-spec.json include/isaec/api/generated/isaac_api_spec.hpp

  # The extractor reads the shipped binary, which is not distributable and is
  # not in the repository. Verify only that the tool still parses and that its
  # self-check rejects a bad anchor.
  extractor-selfcheck:
    name: binding-extractor-selfcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compiles and runs
        run: |
          python3 -c "import ast,sys; ast.parse(open('tools/extract-binding-tables.py').read())"
          # Without the binary present the tool must exit non-zero with a clear
          # message rather than emitting an empty survey.
          if python3 tools/extract-binding-tables.py >/dev/null 2>&1; then
            echo "::error::extractor must fail when the game binary is absent"
            exit 1
          fi

      - name: Archive inspector rejects input that is not an archive
        run: |
          python3 -c "import ast,sys; ast.parse(open('tools/inspect-archive.py').read())"
          # A file whose header claims an index that cannot fit must be refused.
          # An inspector that prints a confident table for garbage is worse than
          # one that prints nothing, so the failure path is the thing under test.
          python3 - <<'PY'
          import struct
          blob = bytearray(b"ARCH000" + bytes([1]) + b"\0" * 6)
          blob[8:12] = struct.pack("<I", 0xFFFFFFF0)
          blob[12:14] = struct.pack("<H", 4)
          open("not-an-archive.a", "wb").write(bytes(blob))
          PY
          if python3 tools/inspect-archive.py not-an-archive.a; then
            echo "::error::inspector accepted a malformed archive"
            exit 1
          fi
          python3 -c "open('real-archive.a','wb').write(b'ARCH000' + bytes([1]) + b'x'*20)"
          if python3 tools/inspect-archive.py real-archive.a; then
            echo "::error::inspector accepted an archive with no valid index"
            exit 1
          fi
  # Self-test of the release plumbing, not a gate on the current version.
  #
  # A version with no CHANGELOG section is a legitimate state on main: the
  # Release workflow bumps the patch after publishing, so between a release and
  # the next section being written, main is always one version ahead of the
  # changelog. Gating every commit on that would break main after every release.
  # The strict check belongs where a release is cut, and release.yml runs it.
  release-notes:
    name: release-notes-are-writable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detector accepts a documented version
        run: |
          set -euo pipefail
          documented="$(python3 tools/release.py documented)"
          python3 tools/release.py check --expect "$documented"

      - name: Detector rejects an undocumented version
        run: |
          set -euo pipefail
          if python3 tools/release.py check --expect "99.99.99" 2>/dev/null; then
            echo "::error::check passed for a version that has no CHANGELOG section"
            exit 1
          fi
          echo "ok  rejects a missing section, as intended"

      - name: Body renders for a documented version
        run: |
          set -euo pipefail
          documented="$(python3 tools/release.py documented)"
          python3 tools/release.py body "$documented" > body.md
          test -s body.md
          grep -q "Full Changelog" body.md
          grep -qE '^### (Added|Changed|Fixed|Removed)' body.md
          if grep -qE '^\[[^]]+\]:' body.md; then
            echo "::error::release body leaked the changelog link-reference footer"
            exit 1
          fi

      - name: Round-trips a version bump
        run: |
          set -euo pipefail
          before="$(python3 tools/release.py version)"
          python3 tools/release.py bump patch >/dev/null
          after="$(python3 tools/release.py version)"
          git checkout -- CMakeLists.txt
          restored="$(python3 tools/release.py version)"
          echo "bumped ${before} -> ${after}, restored to ${restored}"
          test "$before" != "$after"
          test "$before" = "$restored"
