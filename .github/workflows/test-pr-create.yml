name: Test PR create permission
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: REST createPullRequest probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          curl -sS -o /tmp/resp -w "HTTP %{http_code}\n" \
            -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pulls \
            -d '{"title":"test-pr-create-probe","head":"release/bump-0.1.4","base":"main","body":"probe"}'
          cat /tmp/resp
