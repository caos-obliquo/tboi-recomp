plugins {
    id 'com.android.application'
}

android {
    namespace 'org.caos.isaec'
    compileSdk 34

    defaultConfig {
        applicationId 'org.caos.isaec'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.17'
        ndk {
            abiFilters 'arm64-v8a'
        }
        // Pinned by CI so Gradle does not fetch a second NDK.
        ndkVersion System.getenv('ISAEC_NDK_VERSION') ?: '26.1.10909125'
        externalNativeBuild {
            cmake {
                arguments '-DISAEC_BUILD_TESTS=OFF', '-DISAEC_WITH_LUA=OFF'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// SDL's Java side (org.libsdl.app.SDLActivity) is not vendored. The CI job
// downloads a pinned SDL2 release and points this at its android-project Java
// tree, so the repository stays free of third-party sources.
def sdlJava = project.findProperty('sdlJavaDir')
if (sdlJava) {
    android.sourceSets.main.java.srcDirs += sdlJava
}
